<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssMemeSlider VitaliMay</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./assets/svg/GR_favicon.ico">
</head>
<body>
    <div class="wrapper">
        <h1>cssMemeSlider</h1>

        <div class="slider-container">
            <input type="radio" name="mem" id="mem_01" checked>
            <input type="radio" name="mem" id="mem_02">
            <input type="radio" name="mem" id="mem_03">
            <input type="radio" name="mem" id="mem_04">
            <input type="radio" name="mem" id="mem_05">

            <div class="slider">
                <div class="slide slide--mem_01"></div>
                <div class="slide slide--mem_02"></div>
                <div class="slide slide--mem_03"></div>
                <div class="slide slide--mem_04"></div>
                <div class="slide slide--mem_05"></div>
            </div>

            <div class="slider-text">
                <div class="text text--mem_01">Amet consectetur adipis elit</div>
                <div class="text text--mem_02">Iste aspernatur ex</div>
                <div class="text text--mem_03">Eplicabo voluptatibus</div>
                <div class="text text--mem_04">Recusandae architecto sapiente</div>
                <div class="text text--mem_05">Lorem ipsum dolor sit</div>
            </div>

            <div class="controls">
                <label class="label" for="mem_01">
                    <span class="label-button"></span>
                </label>
                <label class="label" for="mem_02">
                    <span class="label-button"></span>
                </label>
                <label class="label" for="mem_03">
                    <span class="label-button"></span>
                </label>
                <label class="label" for="mem_04">
                    <span class="label-button"></span>
                </label>
                <label class="label" for="mem_05">
                    <span class="label-button"></span>
                </label>
            </div>
        </div>

    </div>
</body>
</html>
